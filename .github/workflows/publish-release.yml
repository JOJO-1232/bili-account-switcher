name: Build extension package

# 只构建、不改动仓库内容；产物作为 Actions Artifact 供下载或后续发布使用。
# 对外分发请以 Releases 页面中的 zip 为准。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "构建版本号，需与 manifest.json 一致（如 1.5.8）"
        required: true
        default: "1.5.8"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ACTUAL=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "manifest version: $ACTUAL / requested: $VERSION"
          test "$ACTUAL" = "$VERSION" || { echo "版本号不一致，已中止构建"; exit 1; }

      - name: Build extension zip
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/icons
          cp manifest.json popup.html popup.css accounts.js background.js content.js dist/
          cp icons/*.png dist/icons/
          (cd dist && zip -r -X "../bili-account-switcher-v$VERSION.zip" .)
          unzip -l "bili-account-switcher-v$VERSION.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bili-account-switcher-v${{ inputs.version }}
          path: bili-account-switcher-v${{ inputs.version }}.zip
          if-no-files-found: error
