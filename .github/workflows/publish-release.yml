      - name: Sync extension source into repository
        run: |
          rm -rf _src && mkdir -p _src
          unzip -q bili-account-switcher-v1.5.8.zip -d _src
          cp -a _src/. .
          rm -rf _src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add v1.5.8 extension source and release artifact" || echo "nothing to commit"
          git push origin HEAD:main

